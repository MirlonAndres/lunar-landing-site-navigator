; ==============================================================================
; PLATFORMIO CONFIGURATION FILE - ESP32-S3 & ESP32 ROBOTIC ARM FIRMWARE
; ARCHIVO DE CONFIGURACION DE PLATFORMIO - FIRMWARE BRAZO ROBOTICO ESP32-S3
; NASA Space Apps Challenge 2026 - Equipo 01 (eq01)
; ==============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.6.1
    madhephaestus/ESP32Servo @ ^1.1.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Secondary environment for standard ESP32 DevKit v1
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.6.1
    madhephaestus/ESP32Servo @ ^1.1.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
